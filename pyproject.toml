[project]
name = "skill-mcp"
# 0.2.0：錯誤格式從純字串改為結構化 JSON（RFC-06）。依 RFC-08 這是
# breaking——呼叫端若解析過錯誤訊息，升級後會失效。0.x 期間以 minor 表達。
version = "0.2.0"
description = "High-throughput FastMCP server for progressive skill loading + sandboxed script execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.6",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
speed = ["uvloop>=0.21; sys_platform != 'win32'"]
# Background-task mode for scripts that outlive a client's request timeout.
# Pulls in pydocket + Redis, hence opt-in. See --enable-tasks.
tasks = ["fastmcp[tasks]>=3.4.6"]

[project.scripts]
skill-mcp = "skill_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_server"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
]
